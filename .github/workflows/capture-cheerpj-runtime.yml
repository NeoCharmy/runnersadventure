- name: Create jar-fix.js with base64 (using Node.js)
  run: |
    node -e "
    const fs = require('fs');
    const jar = fs.readFileSync('web/freej2me-web.jar');
    const base64 = jar.toString('base64');
    const script = \`(function(){
      const originalFetch = window.fetch;
      const jarBase64 = '\${base64}';
      window.fetch = function(url, init) {
        if (typeof url === 'string' && url.endsWith('freej2me-web.jar')) {
          console.log('Intercepting JAR request, serving base64');
          const binaryStr = atob(jarBase64);
          const bytes = new Uint8Array(binaryStr.length);
          for (let i = 0; i < binaryStr.length; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
          }
          return Promise.resolve(new Response(bytes.buffer, {
            status: 200,
            headers: { 'Content-Type': 'application/java-archive' }
          }));
        }
        return originalFetch.apply(this, arguments);
      };
    })();\`;
    fs.writeFileSync('web/jar-fix.js', script);
    "
