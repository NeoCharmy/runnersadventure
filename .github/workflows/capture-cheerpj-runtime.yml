name: Generate jar-fix.js (without line breaks)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download freej2me-web.jar
      run: |
        wget -nv -O web/freej2me-web.jar https://raw.githubusercontent.com/WamWooWam/freej2me-web/master/freej2me-web.jar

    - name: Create jar-fix.js with base64 (single line)
      run: |
        # Encode to base64 without line breaks (-w 0)
        BASE64=$(base64 -w 0 web/freej2me-web.jar)
        # Write the interception script, use printf to safely insert the variable
        cat > web/jar-fix.js << 'EOF'
        (function(){
          const originalFetch = window.fetch;
          const jarBase64 = "BASE64_PLACEHOLDER";

          window.fetch = function(url, init) {
            if (typeof url === 'string' && url.endsWith('freej2me-web.jar')) {
              console.log('Intercepting JAR request, serving base64');
              const binaryStr = atob(jarBase64);
              const bytes = new Uint8Array(binaryStr.length);
              for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
              }
              return Promise.resolve(new Response(bytes.buffer, {
                status: 200,
                headers: { 'Content-Type': 'application/java-archive' }
              }));
            }
            return originalFetch.apply(this, arguments);
          };
        })();
        EOF
        # Replace the placeholder with the actual base64 string (sed works fine with large lines)
        sed -i "s|BASE64_PLACEHOLDER|$BASE64|" web/jar-fix.js

    - name: Commit and push jar-fix.js
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add web/jar-fix.js
        git commit -m "Generate jar-fix.js with base64 JAR (no line breaks)" || echo "Nothing to commit"
        git push
