name: Capture CheerpJ Runtime (Runners)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js & Playwright
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Playwright
      run: |
        npm init -y
        npm install playwright
        npx playwright install chromium

    - name: Launch game and capture all CheerpJ files
      run: |
        node -e '
        const { chromium } = require("playwright");
        const fs = require("fs");
        const path = require("path");

        (async () => {
          const browser = await chromium.launch();
          const page = await browser.newPage();

          // Save every CheerpJ CDN request
          page.on("response", async (response) => {
            const url = response.url();
            if (!url.startsWith("https://cjrtnc.leaningtech.com/")) return;

            try {
              const parsed = new URL(url);
              let relative = parsed.pathname.replace(/^\//, "");
              if (!relative) return;

              const outDir = "cheerpj-local";
              const filePath = path.join(outDir, relative);
              const dir = path.dirname(filePath);
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });

              const buffer = await response.body();
              fs.writeFileSync(filePath, buffer);
              console.log("Saved:", relative, "(" + buffer.length + " bytes)");
            } catch (e) {
              console.error("Could not save", url, e.message);
            }
          });

          // Open your live page
          await page.goto("https://neocharmy.github.io/runnersadventure/web/", { waitUntil: "networkidle" });

          // Click the game link to start the J2ME game
          const gameLink = await page.$("a[href='run']");
          if (gameLink) {
            console.log("Clicking game link…");
            await gameLink.click();
            // Wait long enough for CheerpJ to fully load
            await page.waitForTimeout(25000);
          } else {
            console.error("Game link not found!");
          }

          await browser.close();
          console.log("Capture finished.");
        })();
        '

    - name: Update index.html to use local files
      run: sed -i 's|https://cjrtnc.leaningtech.com/|cheerpj-local/|g' index.html

    - name: Commit everything
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add cheerpj-local/ index.html
        git commit -m "Add local CheerpJ runtime and update index.html" || echo "No changes to commit"
        git push
