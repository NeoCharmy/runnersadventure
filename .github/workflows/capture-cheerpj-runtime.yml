name: Fetch Official CheerpJ 4.2 Runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4

    - name: Clone official cheerpj-meta (main branch)
      run: |
        git clone --depth 1 --branch main https://github.com/leaningtech/cheerpj-meta.git cheerpj-meta

    - name: Copy 4.2 runtime into web/cheerpj-local
      run: |
        mkdir -p web/cheerpj-local
        cp -r cheerpj-meta/4.2/* web/cheerpj-local/

    - name: Update index.html to load from local runtime
      run: |
        sed -i 's|https://cjrtnc.leaningtech.com/|cheerpj-local/|g' web/index.html

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add web/cheerpj-local web/index.html
        git commit -m "Replace runtime with official CheerpJ 4.2" || echo "Nothing to commit"
        git push
