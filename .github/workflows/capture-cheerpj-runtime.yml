name: Capture CheerpJ Runtime (Game Launch)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js & Playwright
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Playwright
      run: |
        npm init -y
        npm install playwright
        npx playwright install chromium

    - name: Capture CheerpJ resources while playing the game
      run: |
        node -e '
        const { chromium } = require("playwright");
        const fs = require("fs");
        const path = require("path");

        (async () => {
          const browser = await chromium.launch();
          const context = await browser.newContext();
          const page = await context.newPage();

          // Intercept and save all CheerpJ CDN responses
          page.on("response", async (response) => {
            const url = response.url();
            if (!url.startsWith("https://cjrtnc.leaningtech.com/")) return;

            try {
              const parsed = new URL(url);
              let relativePath = parsed.pathname.replace(/^\//, "");
              if (!relativePath) return;

              const outputDir = "cheerpj-local";
              const filePath = path.join(outputDir, relativePath);
              const dir = path.dirname(filePath);
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true });

              const buffer = await response.body();
              fs.writeFileSync(filePath, buffer);
              console.log("Saved:", relativePath, "(" + buffer.length + " bytes)");
            } catch (e) {
              console.error("Failed to save", url, e.message);
            }
          });

          // Go to your live GitHub Pages site
          await page.goto("https://neocharmy.github.io/runnersadventure/web/", { waitUntil: "networkidle" });

          // Click the game link to start Sonic Runners Adventure
          const gameLink = await page.$("a[href='run']");
          if (gameLink) {
            console.log("Clicking game link...");
            await gameLink.click();
            // Wait for CheerpJ to fully bootstrap and download all runtime components
            await page.waitForTimeout(25000);
          } else {
            console.error("Game link not found!");
          }

          await browser.close();
          console.log("Capture complete. All files saved in cheerpj-local/");
        })();
        '

    - name: Update index.html to use local CheerpJ files
      run: |
        sed -i 's|https://cjrtnc.leaningtech.com/|cheerpj-local/|g' index.html

    - name: Commit captured runtime and modified index.html
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add cheerpj-local/ index.html
        git commit -m "Add local CheerpJ runtime and make game standalone" || echo "Nothing to commit"
        git push
