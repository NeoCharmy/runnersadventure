name: Mirror CheerpJ 4.2 from CDN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout your repository
      uses: actions/checkout@v4

    - name: Download entire 4.2 runtime from CDN
      run: |
        wget -r -np -nH --cut-dirs=2 \
             --header="User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
             --header="Referer: https://cheerpj.com/" \
             --no-verbose \
             -P web/cheerpj-local \
             https://cjrtnc.leaningtech.com/4.2/

    - name: Update index.html to use local runtime
      run: |
        sed -i 's|https://cjrtnc.leaningtech.com/|cheerpj-local/|g' web/index.html

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add web/cheerpj-local web/index.html
        git commit -m "Add complete CheerpJ 4.2 from CDN" || echo "Nothing to commit"
        git push
