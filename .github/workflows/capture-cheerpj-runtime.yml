name: Package Game Archive

on:
  workflow_dispatch:   # only runs when you click "Run workflow"

permissions:
  contents: write      # needed to push the archive

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download entire game from GitHub Pages
        run: |
          wget \
            --recursive \
            --level=inf \
            --no-host-directories \
            --cut-dirs=1 \
            --include-directories=/runnersadventure \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --no-parent \
            --execute robots=off \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --wait=1 \
            --random-wait \
            --limit-rate=500k \
            --retry-on-http-error=403,404,500,502,503,504 \
            --timeout=30 \
            --tries=3 \
            "https://neocharmy.github.io/runnersadventure/web/run.html"

      - name: Compress all files into a single archive
        run: |
          # Zip the 'runnersadventure' folder that wget just created
          zip -r "SonicRunnersAdventure.zip" runnersadventure/
          # Move the zip to the repository root (already there if run from root)
          mv SonicRunnersAdventure.zip "${{ github.workspace }}/SonicRunnersAdventure.zip"

      - name: Commit and push archive to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SonicRunnersAdventure.zip
          git diff --staged --quiet || git commit -m "Update game archive [skip ci]"
          git push
