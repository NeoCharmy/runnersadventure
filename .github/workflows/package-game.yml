name: Package Full Game Archive

on:
  workflow_dispatch:   # manual trigger only

permissions:
  contents: write

jobs:
  download-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Download all game assets using headless browser
        run: node .github/workflows/download-game.mjs

      - name: Compress entire game folder
        run: zip -r "SonicRunnersAdventure.zip" runnersadventure_offline/

      - name: Commit and push archive to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SonicRunnersAdventure.zip
          git diff --staged --quiet || git commit -m "Update game archive [skip ci]"
          git push
